<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>NFT preview card component</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <article class="card">
        <div class="img-container">
          <img
            src="images/image-equilibrium.jpg"
            alt="Equilibrium"
            class="main-img"
          />
          <div class="overlay">
            <img src="images/icon-view.svg" alt="View icon" class="view-icon" />
          </div>
        </div>

        <div class="content">
          <h1 class="title">Equilibrium #3429</h1>
          <p class="description">
            Our Equilibrium collection promotes balance and calm.
          </p>

          <div class="count">
            <p class="quantity">
              <img src="images/icon-ethereum.svg" alt="" aria-hidden="true" />
              0.041 ETH
            </p>
            <p class="left">
              <img src="images/icon-clock.svg" alt="" aria-hidden="true" />
              3 days left
            </p>
          </div>

          <hr class="divider" />

          <div class="profile">
            <img class="avatar" src="images/image-avatar.png" alt="Avatar" />
            <p class="author">
              Creation of <span class="name">Jules Wyvern</span>
            </p>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
